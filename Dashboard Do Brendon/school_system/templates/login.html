{% extends "base.html" %}

{% block title %}Login - Sistema de Gestão Escolar{% endblock %}

{% block content %}
<div style="display: flex; justify-content: center; align-items: center; min-height: 100vh;">
    <div class="card" style="width: 100%; max-width: 400px;">
        <h1 style="text-align: center; margin-bottom: 30px;">Bem-vindo</h1>
        
        <form method="POST">
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>
            
            <div class="form-group">
                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" required>
            </div>
            
            <button type="submit" style="width: 100%;">Entrar</button>
        </form>
        
        <div style="text-align: center; margin-top: 20px;">
            <p>Não tem conta? <a href="/cadastro" style="color: #667eea; text-decoration: none;">Cadastre-se aqui</a></p>
        </div>
    </div>
</div>
{% endblock %}
