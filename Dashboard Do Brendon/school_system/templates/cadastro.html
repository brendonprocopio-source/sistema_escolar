{% extends "base.html" %}

{% block title %}Cadastro - Sistema de Gestão Escolar{% endblock %}

{% block content %}
<div style="display: flex; justify-content: center; align-items: center; min-height: 100vh;">
    <div class="card" style="width: 100%; max-width: 500px;">
        <h1 style="text-align: center; margin-bottom: 30px;">Criar Conta de Aluno</h1>
        
        <form method="POST">
            <div class="form-group">
                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" name="nome" required>
            </div>
            
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>
            
            <div class="form-group">
                <label for="cpf">CPF:</label>
                <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" required>
            </div>
            
            <div class="form-group">
                <label for="data_nascimento">Data de Nascimento:</label>
                <input type="date" id="data_nascimento" name="data_nascimento" required>
            </div>
            
            <div class="form-group">
                <label for="telefone">Telefone:</label>
                <input type="text" id="telefone" name="telefone" placeholder="(11) 9999-9999">
            </div>
            
            <div class="form-group">
                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" required>
            </div>
            
            <button type="submit" style="width: 100%;">Cadastrar</button>
        </form>
        
        <div style="text-align: center; margin-top: 20px;">
            <p>Já tem conta? <a href="/login" style="color: #667eea; text-decoration: none;">Faça login aqui</a></p>
        </div>
    </div>
</div>
{% endblock %}
