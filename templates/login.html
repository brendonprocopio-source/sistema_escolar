{% extends 'base.html' %}
{% block titulo %}Entrar{% endblock %}
{% block entrada %}
<form class="card" method="post" action="/login">
  {{ csrf() }}
  <div class="brand"><span>{{ m.icone('cap') }}</span>{{ escola }}</div>
  <div class="campo"><label for="email">E-mail</label>
    <input id="email" name="email" type="email" value="{{ email }}" autocomplete="username" required autofocus></div>
  <div class="campo"><label for="senha">Senha</label>
    <input id="senha" name="senha" type="password" autocomplete="current-password" required></div>
  <button class="btn pri">Entrar</button>
  {% if config.AUTOCADASTRO %}<p class="small muted" style="margin:14px 0 0;text-align:center">Aluno novo? <a href="/cadastro">Criar conta</a></p>{% endif %}
</form>
{% endblock %}
